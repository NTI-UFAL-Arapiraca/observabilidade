metricbeat.config.modules:
  path: ${path.config}/modules.d/*.yml

output.elasticsearch:
  hosts: ['http://esud01:9200']
  username: 'elastic'
  password: '${ELASTIC_PASSWORD}'

setup.kibana:
  host: 'http://kibanaud:5601'

metricbeat.modules:
  - module: prometheus
    period: 10s
    hosts: ['${UD_NEST_METRICS_HOST}']
    metrics_path: /metrics
    enabled: true
    metricsets:
      - collector
    service.name: ud_nest_api
    fields:
      project: ud_nest
