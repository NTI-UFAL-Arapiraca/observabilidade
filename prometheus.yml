global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ud_nest_api'
    file_sd_configs:
      - files: ['/etc/prometheus/targets/ud-nest.yml']
    metrics_path: /metrics

