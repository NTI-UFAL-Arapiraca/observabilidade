# Proxy reverso da stack de observabilidade.
# Cada serviço é exposto em uma rota própria. O DNS interno do Docker é resolvido
# em tempo de requisição (variáveis em proxy_pass), então o nginx inicia mesmo que
# algum serviço não esteja no ar (ex.: modo local com apenas parte da stack).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Página inicial com links para os serviços.
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Grafana: serve a partir do subcaminho /grafana (GF_SERVER_SERVE_FROM_SUB_PATH),
    # portanto o prefixo é preservado.
    location = /grafana { return 301 /grafana/; }
    location /grafana/ {
        set $upstream http://grafana:3000;
        proxy_pass $upstream;
    }

    # Kibana: usa server.basePath=/kibana com rewriteBasePath, prefixo preservado.
    location = /kibana { return 301 /kibana/; }
    location /kibana/ {
        set $upstream http://kibanaud:5601;
        proxy_read_timeout 300s;
        proxy_pass $upstream;
    }

    # Prometheus: route-prefix=/, então o prefixo é removido aqui.
    # --web.external-url=/prometheus/ faz a UI gerar links corretos.
    location = /prometheus { return 301 /prometheus/; }
    location /prometheus/ {
        set $upstream http://prometheus:9090;
        rewrite ^/prometheus/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    # Elasticsearch (API): não suporta subcaminho, o prefixo é removido.
    # A autenticação do Elasticsearch continua obrigatória.
    location = /elasticsearch { return 301 /elasticsearch/; }
    location /elasticsearch/ {
        set $upstream http://esud01:9200;
        rewrite ^/elasticsearch/(.*)$ /$1 break;
        proxy_read_timeout 300s;
        proxy_pass $upstream;
    }

    # APM Server (ingestão): agentes usam serverUrl http://<host>/apm
    location = /apm { return 301 /apm/; }
    location /apm/ {
        set $upstream http://apm-server:8200;
        rewrite ^/apm/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
}
