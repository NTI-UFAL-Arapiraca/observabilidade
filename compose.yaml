services:
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-targets/institutional:/etc/prometheus/targets:ro

  metricbeat:
    image: docker.elastic.co/beats/metricbeat:9.5.6
    container_name: metricbeat
    user: root
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Defina ELASTIC_PASSWORD no .env}
      UD_NEST_METRICS_HOST: sistemas.arap:3333
    volumes:
      - ./metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["-e", "--strict.perms=false"]
    depends_on:
      - esud01

  grafana:
    image: grafana/grafana:13.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
      - ./grafana-dashboards:/etc/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Defina GF_SECURITY_ADMIN_PASSWORD no .env}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    restart: unless-stopped
    depends_on:
      - prometheus

  esud01:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    container_name: esud01
    environment:
      node.name: esud01
      discovery.type: single-node
      bootstrap.memory_lock: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "true"
      xpack.security.autoconfiguration.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Defina ELASTIC_PASSWORD no .env}
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data-v9:/usr/share/elasticsearch/data

  kibana-setup:
    image: docker.elastic.co/kibana/kibana:9.5.6
    entrypoint: ["/usr/share/kibana/node/default/bin/node", "/provisioning/configure-system-user.cjs"]
    command: []
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Defina ELASTIC_PASSWORD no .env}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-${ELASTIC_PASSWORD}}
    volumes:
      - ./kibana-provisioning:/provisioning:ro
    depends_on:
      - esud01

  kibanaud:
    image: docker.elastic.co/kibana/kibana:9.5.6
    container_name: kibanaud
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: '["http://esud01:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-${ELASTIC_PASSWORD}}
    depends_on:
      kibana-setup:
        condition: service_completed_successfully

  kibana-import:
    image: docker.elastic.co/kibana/kibana:9.5.6
    profiles: [provisioning]
    entrypoint: ["/usr/share/kibana/node/default/bin/node", "/provisioning/import.cjs"]
    command: []
    environment:
      KIBANA_URL: http://kibanaud:5601
      KIBANA_IMPORT_USERNAME: ${KIBANA_IMPORT_USERNAME:-elastic}
      KIBANA_IMPORT_PASSWORD: ${KIBANA_IMPORT_PASSWORD:-${ELASTIC_PASSWORD}}
    volumes:
      - ./kibana-provisioning:/provisioning:ro
    depends_on:
      - kibanaud

  apm-server:
    image: docker.elastic.co/apm/apm-server:9.5.6
    container_name: apm-server
    ports:
      - "8200:8200"
    command:
      - -e
      - -E
      - apm-server.host=0.0.0.0:8200
      - -E
      - apm-server.rum.enabled=true
      - -E
      - apm-server.kibana.enabled=true
      - -E
      - apm-server.kibana.host=kibanaud:5601
      - -E
      - apm-server.kibana.username=elastic
      - -E
      - apm-server.kibana.password=${ELASTIC_PASSWORD:?Defina ELASTIC_PASSWORD no .env}
      - -E
      - output.elasticsearch.hosts=["esud01:9200"]
      - -E
      - output.elasticsearch.username=elastic
      - -E
      - output.elasticsearch.password=${ELASTIC_PASSWORD:?Defina ELASTIC_PASSWORD no .env}
    depends_on:
      - esud01
      - kibanaud

networks:
  default:
    name: observabilidade
    ipam:
      config:
        - subnet: 10.202.0.0/24

volumes:
  grafana-data:
  elasticsearch-data-v9:
